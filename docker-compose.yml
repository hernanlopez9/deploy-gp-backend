services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_adventureworks
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin@12345!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Admin@12345!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "Admin@12345!"
    volumes:
      - ./backups:/var/opt/mssql/backups
    command: >
      bash -c "
        echo '=== Restaurando AdventureWorks ===' &&
       /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Admin@12345!' -No -Q \"
      RESTORE DATABASE [AdventureWorks2022]
      FROM DISK = '/var/opt/mssql/backups/AdventureWorks2022.bak'
      WITH MOVE 'AdventureWorks2022' TO '/var/opt/mssql/data/AdventureWorks2022.mdf',
           MOVE 'AdventureWorks2022_log' TO '/var/opt/mssql/data/AdventureWorks2022_log.ldf',
           REPLACE, RECOVERY
       \" &&
        echo '=== Base de datos lista ==='
      "
    restart: "no"

volumes:
  sqlserver_data:
    driver: local